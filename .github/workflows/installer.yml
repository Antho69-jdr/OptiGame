name: Installeur

# Fabrique l'installeur sur une machine Windows neuve, puis l'installe, lance l'appli, la met à jour par-dessus (comme le fait
# la mise à jour automatique) et la désinstalle, en silence, pour le vérifier. L'installeur est à télécharger dans le résumé
# de l'exécution (« OptiGame-Setup »).
# - À la demande : onglet Actions > Installeur > Run workflow ; ou à chaque changement de l'installeur.
# - Tag « v* » (ex. v1.0.0) : en plus, brouillon de version GitHub avec l'installeur, à publier à la main.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'installer/**'
      - 'scripts/build-installer.ps1'
      - '.github/workflows/installer.yml'
      - 'Directory.Build.props'
      - '.signpath/**'
      - 'LICENSE'

permissions:
  contents: write
  actions: read   # SignPath lit la tâche et télécharge les fichiers envoyés

jobs:
  installer:
    runs-on: windows-latest
    # Jusqu'à 2 × 30 min d'attente des approbations de signature (tag).
    timeout-minutes: 100
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # Un tag posé sur un commit d'une autre version publierait un installeur qui ne correspond pas à son nom.
      - name: Version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version de Directory.Build.props : il a été posé sur le mauvais commit. Supprimez-le (git push origin :refs/tags/$env:GITHUB_REF_NAME), puis reposez-le sur le bon commit."
          }
          "Tag $env:GITHUB_REF_NAME = version $version de Directory.Build.props."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test tests/OptiGame.Core.Tests -c Release

      # La mise à jour automatique interroge l'API de GitHub (sans compte : limitée à 60 requêtes par heure et par adresse IP,
      # d'où continue-on-error) : réponse réellement lue et comprise par l'appli.
      - name: Mise à jour automatique (ce que voit l'appli)
        continue-on-error: true
        run: dotnet run --project tools/OptiGame.DiagDump -c Release -- --update-check

      - name: Inno Setup
        run: |
          # 6.7 ou plus récent (thème sombre, images PNG, couleur de fond) : l'image du runner peut en fournir une plus ancienne,
          # d'où « upgrade » (installe aussi s'il est absent). ISCC.exe ne porte pas de numéro de version : c'est
          # installer/OptiGame.iss qui refuse de compiler avec une version trop ancienne.
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup : code $LASTEXITCODE" }

      - name: Publication de l'appli
        run: ./scripts/build-installer.ps1 -Step Publish

      # Signature par SignPath Foundation (README, « Signature du code ») : pour un tag seulement, une fois le projet SignPath
      # prêt (variables du dépôt SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG ; secret
      # SIGNPATH_API_TOKEN). Configurations de fichiers : .signpath/artifact-configurations. Chaque demande attend
      # l'approbation manuelle dans SignPath (30 min max) : d'abord les fichiers d'OptiGame, puis l'installeur qui les contient.
      - name: Fichiers d'OptiGame à signer
        if: env.SIGN == 'true'
        run: |
          New-Item -ItemType Directory -Force artifacts/to-sign/app | Out-Null
          foreach ($f in 'OptiGame.exe', 'OptiGame.dll', 'OptiGame.Core.dll', 'OptiGame.Platform.dll') {
            Copy-Item "artifacts/publish/$f" artifacts/to-sign/app/
          }

      - name: Envoi des fichiers d'OptiGame
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OptiGame-app-non-signe
          path: artifacts/to-sign/app/*
          if-no-files-found: error

      - name: Signature des fichiers d'OptiGame (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '1800'
          output-artifact-directory: artifacts/signed/app

      - name: Fichiers d'OptiGame signés
        if: env.SIGN == 'true'
        run: |
          foreach ($f in 'OptiGame.exe', 'OptiGame.dll', 'OptiGame.Core.dll', 'OptiGame.Platform.dll') {
            $signed = "artifacts/signed/app/$f"
            $s = Get-AuthenticodeSignature $signed
            if ($s.Status -ne 'Valid') { throw "$f : signature non valide ($($s.Status))." }
            "$f : signé par $($s.SignerCertificate.Subject)"
            Copy-Item $signed "artifacts/publish/$f" -Force
          }

      - name: Fabrication de l'installeur
        run: ./scripts/build-installer.ps1 -Step Package

      - name: Envoi de l'installeur
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OptiGame-Setup-non-signe
          path: artifacts/installer/OptiGame-Setup-*.exe
          if-no-files-found: error

      - name: Signature de l'installeur (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '1800'
          output-artifact-directory: artifacts/signed/installer

      - name: Installeur signé
        if: env.SIGN == 'true'
        run: |
          $signed = Get-ChildItem artifacts/signed/installer/OptiGame-Setup-*.exe | Select-Object -First 1
          if (-not $signed) { throw 'Installeur signé introuvable.' }
          $s = Get-AuthenticodeSignature $signed.FullName
          if ($s.Status -ne 'Valid') { throw "Installeur : signature non valide ($($s.Status))." }
          "Installeur signé par $($s.SignerCertificate.Subject)"
          Copy-Item $signed.FullName (Join-Path artifacts/installer $signed.Name) -Force

      - name: Installation silencieuse
        run: |
          $setup = Get-ChildItem artifacts/installer/OptiGame-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "Installation : code $($p.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'OptiGame'
          foreach ($f in 'OptiGame.exe', 'tools\PresentMon-2.6.0-x64.exe', 'THIRD-PARTY-NOTICES.txt', 'LICENSE.txt', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "Absent après l'installation : $f" }
          }
          if ($env:SIGN -eq 'true') {
            $s = Get-AuthenticodeSignature (Join-Path $app 'OptiGame.exe')
            if ($s.Status -ne 'Valid') { throw "OptiGame.exe installé : signature non valide ($($s.Status))." }
          }
          (Get-Item (Join-Path $app 'OptiGame.exe')).VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          # Lue par OptiGame pour savoir s'il est la copie installée (seule à se mettre à jour elle-même).
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{BEC983EC-07E6-4D4C-A824-72F7135018FA}_is1' |
            Format-List DisplayName, DisplayVersion, InstallLocation
          "{0:N0} Mo installés" -f ((Get-ChildItem $app -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Démarrage de l'appli installée
        continue-on-error: true
        run: |
          $exe = Join-Path $env:ProgramFiles 'OptiGame\OptiGame.exe'
          $p = Start-Process $exe -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 20
          $data = Join-Path $env:LOCALAPPDATA 'OptiGame'
          $log = Join-Path $data 'logs\optigame.log'
          if (Test-Path $log) { Get-Content $log -Encoding UTF8 }
          if ($p.HasExited) { throw "OptiGame s'est arrêté au démarrage (code $($p.ExitCode))." }
          Set-Content (Join-Path $data 'quit.request') (Get-Date -Format o)
          if (-not $p.WaitForExit(20000)) { Stop-Process $p -Force; throw "OptiGame ne s'est pas fermé sur demande (quit.request)." }
          'OptiGame a démarré puis s''est fermé proprement.'

      # Ce que fait la mise à jour automatique : installeur sans fenêtre et /RELAUNCH, pendant qu'OptiGame tourne. L'installeur
      # doit le fermer proprement (quit.request), le remplacer, puis le relancer.
      - name: Mise à jour silencieuse (appli lancée)
        run: |
          $app = Join-Path $env:ProgramFiles 'OptiGame'
          $data = Join-Path $env:LOCALAPPDATA 'OptiGame'
          $log = Join-Path $data 'logs\optigame.log'
          $old = Start-Process (Join-Path $app 'OptiGame.exe') -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 10
          if (-not (Select-String -Path $log -SimpleMatch 'Mises à jour : copie installée' -Quiet)) {
            Get-Content $log -Tail 20
            throw "OptiGame ne s'est pas reconnu comme copie installée : il ne se mettrait pas à jour."
          }
          $setup = Get-ChildItem artifacts/installer/OptiGame-Setup-*.exe | Select-Object -First 1
          # Pas de -Wait : il attendrait aussi les descendants de l'installeur, dont OptiGame qu'il relance (il ne s'arrête pas).
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/RELAUNCH=minimized','/LOG=update.log' -PassThru
          $null = $p.Handle # sans lui, PowerShell ne garde pas le code de sortie
          if (-not $p.WaitForExit(120000)) { Get-Content update.log -Tail 40; throw "L'installeur de la mise à jour ne s'est pas terminé en 2 min." }
          if ($p.ExitCode -ne 0) { Get-Content update.log -Tail 40; throw "Mise à jour : code $($p.ExitCode)" }
          if (-not $old.HasExited) { throw "L'ancienne instance d'OptiGame tourne encore après la mise à jour." }
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Seconds 1; $new = Get-Process OptiGame -ErrorAction SilentlyContinue | Select-Object -First 1 } until ($new -or (Get-Date) -gt $deadline)
          if (-not $new) { Get-Content update.log -Tail 40; throw "OptiGame n'a pas été relancé après la mise à jour." }
          Start-Sleep -Seconds 10
          Get-Content $log -Tail 8
          Set-Content (Join-Path $data 'quit.request') (Get-Date -Format o)
          if (-not $new.WaitForExit(20000)) { Stop-Process $new -Force; throw "OptiGame relancé ne s'est pas fermé sur demande (quit.request)." }
          "Mise à jour silencieuse : ancienne instance fermée (pid $($old.Id)), nouvelle relancée (pid $($new.Id))."

      - name: Désinstallation silencieuse
        run: |
          $app = Join-Path $env:ProgramFiles 'OptiGame'
          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path (Join-Path $app 'OptiGame.exe')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $app 'OptiGame.exe')) { throw 'OptiGame.exe encore présent après la désinstallation.' }
          'Désinstallé.'

      - uses: actions/upload-artifact@v4
        with:
          name: OptiGame-Setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Brouillon de version (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem artifacts/installer/OptiGame-Setup-*.exe | Select-Object -First 1).FullName
          $signing = if ($env:SIGN -eq 'true') {
            'Signé par SignPath Foundation (signature gratuite pour les logiciels libres). Tant que la réputation de la signature se construit, Windows SmartScreen peut encore afficher un avertissement (« Informations complémentaires » puis « Exécuter quand même »).'
          } else {
            'Non signé : Windows SmartScreen peut afficher un avertissement (« Informations complémentaires » puis « Exécuter quand même »).'
          }
          gh release create $env:GITHUB_REF_NAME $setup --draft --title "OptiGame $env:GITHUB_REF_NAME" --notes "Installeur Windows 10 et 11 (x64). $signing Déjà installé (1.2.0 ou plus récent) ? OptiGame se met à jour tout seul."
